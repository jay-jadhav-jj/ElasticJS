<!DOCTYPE html>

<html>
    <head>
        <title>ElasticJS by Jay Jadhav</title>
        <meta charset="UTF-8">

        <link rel="stylesheet" href="style.css">

        <!-- Oswald google font import -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <script type="module" src="./script.js"></script>

        <main>
            <h1 id="title">ElasticJS</h1>

            <h2 id="credit">By Jay Jadhav</h2>
            <!--Built for 1280x585-->

            <div id="panel-wrapper">
                <canvas id="game-panel" width="760" height="410"></canvas>
                <div id="info-panel">
                    <a id="link" href="https://github.com/jay-jadhav-jj/ElasticJS" style="margin-top: 33px;">Github Page</a>
                    <p>Controls: </p>

                    <ul>
                        <li>Left: A, Left Arrow</li>
                        <li>Right: D, Right Arrow</li>
                        <li>Jump: W, Up Arrow, Space</li>
                    </ul>
                    
                    <div class="slider-wrapper">
                        <label for="plrSpeed">Speed</label>
                        <input type="range" id="plrSpeed" min="0" max="1000" value="200" step="10">
                    </div>
                    <div class="slider-wrapper">
                        <label for="plrJumpForce">Jump Force</label>
                        <input type="range" id="plrJumpForce" min="0" max="1500" value="500" step="50">
                    </div>
                    <div class="slider-wrapper">
                        <label for="plrGravity">Gravity</label>
                        <input type="range" id="plrGravity" min="0" max="50" value="10" step="1">
                    </div>

                    <div id="scene-picker-wrapper">
                        <label>Scene</label>
                        <div id="scene-buttons">
                            <button>1</button>
                            <button>2</button>
                            <button>3</button>
                            <button>4</button>
                            <button>C</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
